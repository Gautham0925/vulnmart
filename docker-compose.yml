services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulnmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnmarket_local}
      POSTGRES_DB: vulnmarket
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnmarket"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file:
      - ${ENV_FILE:-.env.training}
    environment:
      DATABASE_URL: postgresql+psycopg://vulnmarket:${POSTGRES_PASSWORD:-vulnmarket_local}@db:5432/vulnmarket
      REDIS_URL: redis://redis:6379/0
      KEYS_DIR: /app/keys
    volumes: [keys:/app/keys]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    depends_on: [backend]
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
volumes:
  pgdata:
  keys:
